name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Build & Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  backend:
    name: Backend (Syntax & Node Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: node --check server.js
      - run: npm test
        env:
          MONGODB_URI: mongodb://localhost:27017/test
          DB_NAME: test_db
          JWT_SECRET: ci-test-secret

  ai-rag-service:
    name: AI Service (Compile, Unit Tests & Eval)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-rag-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m py_compile main.py retrieval.py streaming.py eval/run_eval.py
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python eval/run_eval.py

